<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WB Travel · Динамика ошибок</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Huninn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --lav-50:#f1ebfb; --lav-100:#e4d9f5; --lav-200:#d3c2ee; --lav-300:#bda5e5;
    --lav-400:#a488e3; --lav-500:#8b64d6; --lav-600:#7c4ecf; --lav-700:#6d3fd6;
    --lav-800:#5a2fb8; --text:#2f2350; --text-soft:#5b4b85; --line:#d3c2ee;
    --green:#16a34a; --red:#e11d48; --amber:#d97706;
    --bg-page:#ede7f6; --bg-card:#ffffff; --bg-input:#f1ebfb; --bg-hover:#e4d9f5; --bg-soft:#f1ebfb;
    --shadow:0 8px 28px rgba(109,63,214,.18); --shadow-card:0 4px 12px rgba(109,63,214,.1);
    --radius-sm:8px; --radius-md:14px; --radius-lg:20px;
  }
  html[data-theme="dark"] {
    --lav-400:#c9b6f0; --lav-500:#b39be8; --lav-600:#a488e3; --lav-700:#8b64d6; --lav-800:#7c4ecf;
    --lav-50:#2e2348; --lav-100:#3a2b5c; --lav-200:#4a3870; --lav-300:#5a4585;
    --text:#ece5fb; --text-soft:#b8a8d9; --line:rgba(228,217,245,.14);
    --green:#22c55e; --red:#f43f5e; --amber:#f59e0b;
    --bg-page:#14101e; --bg-card:#1e1730; --bg-input:#2a2044; --bg-hover:#2f2548; --bg-soft:#241c3a;
    --shadow:0 8px 28px rgba(0,0,0,.5); --shadow-card:0 0 20px rgba(139,100,214,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Huninn', sans-serif; }
  body { background: var(--bg-page); color: var(--text); padding: 24px; min-height: 100vh; transition: background .25s, color .25s; }
  
  .app-container { max-width: 1500px; margin: 0 auto; background: var(--bg-card); border-radius: var(--radius-lg); padding: 26px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; border-bottom: 2px solid var(--lav-300); padding-bottom: 14px; }
  .logo { font-size: 24px; font-weight: 800; color: var(--lav-700); display: flex; align-items: center; gap: 10px; }
  .btn { background: var(--lav-500); color: #fff; border: none; padding: 10px 20px; border-radius: 50px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: .2s; text-decoration: none; font-size: 14px; }
  .btn:hover { background: var(--lav-600); transform: translateY(-2px); }
  .btn-outline { background: transparent; border: 2px solid var(--lav-400); color: var(--lav-700); }
  .btn-outline:hover { background: var(--lav-100); color: var(--lav-800); }
  
  .db-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 20px; border: 1px solid var(--line); box-shadow: var(--shadow-card); margin-bottom: 20px; }
  .db-chart-wrap { position: relative; height: 250px; width: 100%; }
  
  .tracking-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
  .tracking-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; box-shadow: var(--shadow-card); }
  .empty-slot { border: 2px dashed var(--lav-300); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--lav-500); background: var(--lav-50); cursor: pointer; min-height: 200px; }
  
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(60,40,100,.4); backdrop-filter: blur(6px); justify-content: center; align-items: center; z-index: 1000; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--bg-card); padding: 28px; border-radius: var(--radius-lg); width: 90%; max-width: 520px; box-shadow: var(--shadow); border: 1px solid var(--line); max-height: 90vh; overflow-y: auto; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-weight: 700; margin-bottom: 5px; color: var(--text-soft); font-size: 13px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 14px; outline: none; background: var(--bg-input); color: var(--text); font-family: inherit; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--lav-500); background: var(--bg-card); box-shadow: 0 0 0 3px rgba(139,100,214,.15); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .btn-cancel { background: #e4d9f5; color: var(--lav-700); }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="logo"><i class="fas fa-chart-line"></i> Динамика ошибок</div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-outline" onclick="toggleTheme()" style="padding:8px 16px;"><i class="fas fa-moon"></i></button>
      <a href="index.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Назад к ошибкам</a>
    </div>
  </div>

  <div style="margin-bottom: 20px;">
    <h2 id="pageOperatorName" style="font-size: 20px; color: var(--text);">Загрузка...</h2>
  </div>

  <div class="db-card">
    <h3 style="font-size: 14px; color: var(--text-soft); margin-bottom: 15px;">Ошибки за 14 дней (по весу)</h3>
    <div class="db-chart-wrap"><canvas id="trackingChart"></canvas></div>
  </div>

  <div id="qaIssuesBlock" class="db-card" style="margin-bottom: 20px; display: none; background: var(--bg-soft); border-left: 4px solid var(--red);">
    <h3 style="margin-bottom: 15px; font-size: 16px; color: var(--text);"><i class="fas fa-clipboard-list" style="color: var(--red);"></i> Требуют разбора (QA)</h3>
    <div id="qaIssuesList"></div>
  </div>

  <div class="db-card" style="background: transparent; border: none; box-shadow: none; padding: 0;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
      <h3 style="font-size: 16px;"><i class="fas fa-tasks"></i> Отработка ошибок</h3>
    </div>
    
    <div class="tabs" style="margin-bottom: 20px; max-width: 300px; border: 1px solid var(--line); display: flex; background: var(--bg-card); border-radius: 12px; padding: 6px;">
      <button class="tab active" id="tabActive" onclick="switchView('active')" style="flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 800; color: var(--text-soft); background: transparent;">В работе</button>
      <button class="tab" id="tabArchive" onclick="switchView('archive')" style="flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 800; color: var(--text-soft); background: transparent;">Архив</button>
    </div>

    <div id="trackingCardsContainer"></div>
  </div>
</div>

<!-- Модалка карточки -->
<div class="modal-overlay" id="trackingModalOverlay">
  <div class="modal">
    <h2 id="trkModalTitle" style="margin-bottom: 18px; color: var(--lav-700);">Карточка</h2>
    <input type="hidden" id="trkTrackingId">
    <div class="form-group">
      <label>Сущность (ID)</label>
      <input type="text" id="trkEntityId">
    </div>
    <div class="form-group">
      <label>Класс ошибки</label>
      <select id="trkClassSelect"></select>
    </div>
    <div class="form-group">
      <label>Описание ошибки (факт)</label>
      <textarea id="trkErrorDesc" rows="2"></textarea>
    </div>
    <div class="form-group">
      <label>Причина</label>
      <textarea id="trkCause" rows="2"></textarea>
    </div>
    <div class="form-group">
      <label>Принятые меры / Договоренности</label>
      <textarea id="trkMeasures" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label>Дата следующей проверки</label>
      <input type="date" id="trkNextDate">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-cancel" onclick="document.getElementById('trackingModalOverlay').classList.remove('show')">Отмена</button>
      <button type="button" class="btn" onclick="saveCard()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Модалка "Разобрали" -->
<div class="modal-overlay" id="dismissModalOverlay">
  <div class="modal">
    <h2 style="margin-bottom: 18px; color: var(--lav-700);">Завершение разбора</h2>
    <input type="hidden" id="dismissTrackingId">
    <div class="form-group">
      <label>Принятые меры / Договоренности</label>
      <textarea id="dismissMeasures" rows="3" placeholder="Введите, что было сделано..."></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-cancel" onclick="document.getElementById('dismissModalOverlay').classList.remove('show')">Отмена</button>
      <button type="button" class="btn" onclick="confirmDismiss()">В архив</button>
    </div>
  </div>
</div>

<script>
  const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbySycxvB0SYt8UXsizlvBCm_1V7uR0jEdAVdFFyY7LxAVXzWsz2sq9htQU5t7I7Ib-h/exec'; 
  
  let currentOperator = null;
  let chartInstance = null;
  let classes = [];
  let allCards = [];
  let currentQaTrackingId = null;
  let currentView = 'active';

  function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
    });
  }

  const urlParams = new URLSearchParams(window.location.search);
  const opId = urlParams.get('opId');
  const opName = urlParams.get('name') || 'Оператор';
  const opLine = urlParams.get('line') || 'line1';

  if (opId) {
    currentOperator = { id: opId, name: opName, line: opLine };
    document.getElementById('pageOperatorName').textContent = opName;
    document.title = `WB Travel · Динамика: ${opName}`;
    loadData();
  }

  async function loadData() {
    try {
      const res = await fetch(`${SHEETS_URL}?action=getTrackingData&operatorId=${currentOperator.id}`);
      const json = await res.json();
      
      if (!json.ok) throw new Error(json.error || 'Ошибка сервера');
      
      const data = json.data;
      classes = data.classes || [];
      allCards = data.cards || [];
      
      console.log("Загруженные карточки:", allCards); // Для отладки
      
      renderChart(data.chartData);
      renderQaIssues();
      renderCards();
    } catch (e) {
      console.error('Ошибка загрузки:', e);
      alert('Не удалось загрузить данные: ' + e.message);
    }
  }

  function renderChart(chartData) {
    const ctx = document.getElementById('trackingChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    const errorsByDate = {};
    allCards.forEach(c => {
      if (c.createdAt && c.errorClass && c.status !== 'pending_review') {
        const d = new Date(c.createdAt);
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dateKey = `${dd}.${mm}`;
        
        if (!errorsByDate[dateKey]) errorsByDate[dateKey] = [];
        
        const cls = classes.find(cl => cl.code === c.errorClass);
        errorsByDate[dateKey].push({
          name: cls ? cls.name : c.errorClass,
          weight: cls ? cls.weight : '?'
        });
      }
    });

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: chartData.map(d => d.date),
        datasets: [
          { label: 'Критичные (8-10)', data: chartData.map(d => d.critical), backgroundColor: '#ef4444', borderRadius: 4 },
          { label: 'Средние (4-7)', data: chartData.map(d => d.normal), backgroundColor: '#f59e0b', borderRadius: 4 },
          { label: 'Мелкие (1-3)', data: chartData.map(d => d.minor), backgroundColor: '#10b981', borderRadius: 4 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1 } } },
        plugins: { 
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: {
            callbacks: {
              afterBody: function(context) {
                const date = context[0].label;
                const errs = errorsByDate[date];
                if (!errs || errs.length === 0) return 'Ошибок нет';
                return errs.map(e => `• ${e.name} (вес: ${e.weight})`);
              }
            }
          }
        }
      }
    });
  }

  function renderQaIssues() {
    const block = document.getElementById('qaIssuesBlock');
    const list = document.getElementById('qaIssuesList');
    if (!block || !list) return;

    const unprocessed = allCards.filter(c => c.status === 'pending_review');
    
    if (unprocessed.length === 0) {
      block.style.display = 'none';
      return;
    }

    block.style.display = 'block';
    list.innerHTML = unprocessed.map(card => {
      const cls = classes.find(c => c.code === card.errorClass);
      const clsName = cls ? cls.name : card.errorClass;
      
      return `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-card); border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--line);">
          <div style="font-size: 13px;">
            <b style="color: var(--red);">${escapeHtml(clsName)}</b> <br>
            <b>Сущность:</b> ${escapeHtml(card.entityId || '—')} <br>
            <span style="color: var(--text-soft); font-style: italic;">"${escapeHtml(card.errorDesc || 'Без комментария')}"</span>
          </div>
          <div style="display: flex; gap: 8px; flex-shrink: 0; margin-left: 10px;">
            <button class="btn btn-outline" style="padding: 6px 12px; font-size: 12px;" onclick="openDismissModal('${card.trackingId}')">Разобрали</button>
            <button class="btn" style="padding: 6px 12px; font-size: 12px;" onclick="createFromQa('${card.trackingId}')">Взять на разбор</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function createFromQa(trackingId) {
    const existing = allCards.find(c => c.trackingId === trackingId && c.status === 'active');
    if (existing) {
      alert('Эта ошибка уже находится в работе!');
      return;
    }

    const qaCard = allCards.find(c => c.trackingId === trackingId);
    if (!qaCard) return;

    openModal();
    
    document.getElementById('trkClassSelect').value = qaCard.errorClass;
    document.getElementById('trkErrorDesc').value = qaCard.errorDesc || '';
    document.getElementById('trkCause').value = ''; 
    document.getElementById('trkMeasures').value = '';
    document.getElementById('trkEntityId').value = qaCard.entityId || '';
    
    document.getElementById('trkTrackingId').value = ''; 
    window._pendingGroupId = qaCard.groupId; 
  }

  function openDismissModal(trackingId) {
    document.getElementById('dismissTrackingId').value = trackingId;
    document.getElementById('dismissMeasures').value = '';
    document.getElementById('dismissModalOverlay').classList.add('show');
  }

  async function confirmDismiss() {
    const trackingId = document.getElementById('dismissTrackingId').value;
    const measures = document.getElementById('dismissMeasures').value.trim();
    
    if (!measures) {
      alert('Пожалуйста, укажите принятые меры');
      return;
    }

    const existingActive = allCards.find(c => c.trackingId === trackingId && c.status === 'active');
    if (existingActive) {
      alert('Карточка находится в работе. Сначала завершите проверку!');
      return;
    }

    const qaCard = allCards.find(c => c.trackingId === trackingId);
    if (!qaCard) return;

    const payload = { ...qaCard };
    payload.status = 'archived';
    payload.stage = 'final';
    payload.measures = measures;
    
    try {
      const res = await fetch(SHEETS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'saveTrackingCard', payload })
      });
      const json = await res.json();
      
      if (json.ok) {
        document.getElementById('dismissModalOverlay').classList.remove('show');
        loadData();
      } else {
        alert('Ошибка: ' + json.error);
      }
    } catch(e) { alert('Ошибка сети'); }
  }

  function switchView(view) {
    currentView = view;
    document.getElementById('tabActive').classList.toggle('active', view === 'active');
    document.getElementById('tabArchive').classList.toggle('active', view === 'archive');
    
    document.getElementById('tabActive').style.background = view === 'active' ? 'var(--lav-600)' : 'transparent';
    document.getElementById('tabActive').style.color = view === 'active' ? '#fff' : 'var(--text-soft)';
    document.getElementById('tabArchive').style.background = view === 'archive' ? 'var(--lav-600)' : 'transparent';
    document.getElementById('tabArchive').style.color = view === 'archive' ? '#fff' : 'var(--text-soft)';
    
    renderCards();
  }

  function renderCards() {
    const container = document.getElementById('trackingCardsContainer');
    container.innerHTML = '';

    let filteredCards = [];
    if (currentView === 'active') {
      filteredCards = allCards.filter(c => c.status === 'active');
    } else {
      filteredCards = allCards.filter(c => c.status === 'archived' || c.status === 'done');
    }

    const groups = {};
    filteredCards.forEach(c => {
      if (!groups[c.groupId]) groups[c.groupId] = [];
      groups[c.groupId].push(c);
    });

    Object.keys(groups).forEach(groupId => {
      const groupCards = groups[groupId];
      const stageOrder = { initial: 1, intermediate: 2, final: 3 };
      groupCards.sort((a, b) => stageOrder[a.stage] - stageOrder[b.stage]);

      const rowWrapper = document.createElement('div');
      rowWrapper.className = 'tracking-row';

      groupCards.forEach((card, idx) => {
        const isDone = card.status === 'done' || card.status === 'archived';
        const stageName = card.stage === 'initial' ? 'Первичная' : card.stage === 'intermediate' ? 'Проверка 1' : 'Итоговая';
        const cls = classes.find(c => c.code === card.errorClass);
        
        rowWrapper.insertAdjacentHTML('beforeend', `
          <div class="tracking-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
              <span style="background:var(--lav-100); color:var(--lav-700); padding:2px 8px; border-radius:10px; font-size:11px; font-weight:800;">${stageName}</span>
              ${!isDone ? `<button onclick="openModal('${card.trackingId}')" style="background:none; border:none; color:var(--lav-500); cursor:pointer;"><i class="fas fa-pen"></i></button>` : ''}
            </div>
            <div style="font-size:12px; color:var(--text-soft); margin-bottom:12px; flex:1;">
              <div style="margin-bottom:6px;"><b>Класс:</b> <span style="color:var(--red); font-weight:700;">${cls ? cls.name : card.errorClass}</span></div>
              <div style="margin-bottom:6px;"><b>Сущность:</b> ${card.entityId || '—'}</div>
              <div style="margin-bottom:6px;"><b>Ошибка:</b> ${card.errorDesc || '—'}</div>
              <div style="margin-bottom:6px;"><b>Причина:</b> ${card.cause || '—'}</div>
              <div style="margin-bottom:6px;"><b>Меры:</b> ${card.measures || '—'}</div>
            </div>
            <div style="border-top:1px dashed var(--line); padding-top:10px; display:flex; justify-content:space-between; align-items:center; font-size:11px;">
              <span style="color:var(--text-soft);"><i class="fas fa-calendar-alt"></i> ${card.nextCheckDate || 'Дата не назначена'}</span>
              ${!isDone ? `<button class="btn" style="padding:4px 10px; font-size:11px;" onclick="advanceStage('${card.trackingId}', '${card.stage}')">Далее <i class="fas fa-arrow-right"></i></button>` : '<span style="color:var(--green); font-weight:800;"><i class="fas fa-check-circle"></i> Закрыто</span>'}
            </div>
          </div>
        `);
      });

      for (let i = groupCards.length; i < 3; i++) {
        rowWrapper.insertAdjacentHTML('beforeend', `
          <div class="empty-slot" onclick="addStageToGroup('${groupId}')">
            <div style="text-align:center;">
              <i class="fas fa-plus-circle" style="font-size:28px; margin-bottom:8px;"></i><br>
              <span style="font-size:13px; font-weight:700;">Добавить этап</span>
            </div>
          </div>
        `);
      }

      container.appendChild(rowWrapper);
    });

    if (Object.keys(groups).length === 0) {
      container.insertAdjacentHTML('beforeend', `
        <div class="tracking-row">
          <div class="empty-slot" onclick="openModal()">
            <div style="text-align:center;">
              <i class="fas fa-plus-circle" style="font-size:28px; margin-bottom:8px;"></i><br>
              <span style="font-size:13px; font-weight:700;">Новая ошибка</span>
            </div>
          </div>
        </div>
      `);
    }
  }

  function addStageToGroup(groupId) {
    const groupCards = allCards.filter(c => c.groupId === groupId && c.status === 'active');
    if (groupCards.length === 0) return;

    const lastCard = groupCards[groupCards.length - 1];
    let nextStage = 'intermediate';
    if (lastCard.stage === 'initial') nextStage = 'intermediate';
    else if (lastCard.stage === 'intermediate') nextStage = 'final';

    openModal();
    document.getElementById('trkClassSelect').value = lastCard.errorClass;
    document.getElementById('trkErrorDesc').value = lastCard.errorDesc || '';
    document.getElementById('trkEntityId').value = lastCard.entityId || '';
    window._pendingGroupId = groupId;
    window._pendingStage = nextStage;
  }

  function openModal(trackingId = null) {
    const classSelect = document.getElementById('trkClassSelect');
    classSelect.innerHTML = classes.map(c => `<option value="${c.code}">${c.name} (вес: ${c.weight})</option>`).join('');

    if (trackingId) {
      const card = allCards.find(c => c.trackingId === trackingId);
      if (card) {
        document.getElementById('trkModalTitle').textContent = 'Редактировать';
        document.getElementById('trkTrackingId').value = card.trackingId;
        document.getElementById('trkClassSelect').value = card.errorClass;
        document.getElementById('trkErrorDesc').value = card.errorDesc || '';
        document.getElementById('trkCause').value = card.cause || '';
        document.getElementById('trkMeasures').value = card.measures || '';
        document.getElementById('trkNextDate').value = card.nextCheckDate || '';
        document.getElementById('trkEntityId').value = card.entityId || '';
      }
    } else {
      document.getElementById('trkModalTitle').textContent = 'Новая карточка';
      document.getElementById('trkTrackingId').value = '';
      document.getElementById('trkClassSelect').value = '';
      document.getElementById('trkErrorDesc').value = '';
      document.getElementById('trkCause').value = '';
      document.getElementById('trkMeasures').value = '';
      document.getElementById('trkNextDate').value = '';
      document.getElementById('trkEntityId').value = '';
    }
    currentQaTrackingId = null;
    document.getElementById('trackingModalOverlay').classList.add('show');
  }

  async function saveCard() {
    const trkId = document.getElementById('trkTrackingId').value;
    let stage = 'initial';
    let status = 'active';
    let createdAt = new Date().toISOString();
    let groupId = window._pendingGroupId || 'grp_' + Date.now();

    if (trkId) {
      const existing = allCards.find(c => c.trackingId === trkId);
      if (existing) {
        stage = existing.stage;
        status = existing.status;
        createdAt = existing.createdAt;
        groupId = existing.groupId;
      }
    } else {
      if (window._pendingGroupId) {
        groupId = window._pendingGroupId;
        stage = window._pendingStage;
        window._pendingGroupId = null;
      }
    }

    const payload = {
      trackingId: trkId,
      groupId: groupId,
      operatorId: currentOperator.id,
      operatorName: currentOperator.name,
      line: currentOperator.line,
      errorClass: document.getElementById('trkClassSelect').value,
      entityId: document.getElementById('trkEntityId').value.trim(),
      stage: stage,
      errorDesc: document.getElementById('trkErrorDesc').value,
      cause: document.getElementById('trkCause').value,
      measures: document.getElementById('trkMeasures').value,
      nextCheckDate: document.getElementById('trkNextDate').value,
      status: status,
      createdAt: createdAt,
      source: 'manual'
    };

    try {
      const res = await fetch(SHEETS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'saveTrackingCard', payload })
      });
      const json = await res.json();
      
      if (json.ok) {
        document.getElementById('trackingModalOverlay').classList.remove('show');
        loadData();
      } else {
        alert('Ошибка: ' + json.error);
      }
    } catch(e) { alert('Ошибка сети'); }
  }

  function advanceStage(trackingId, currentStage) {
    const card = allCards.find(c => c.trackingId === trackingId);
    if (!card) return;

    let nextStage = currentStage;
    let nextStatus = 'active';

    if (currentStage === 'initial') nextStage = 'intermediate';
    else if (currentStage === 'intermediate') nextStage = 'final';
    else if (currentStage === 'final') nextStatus = 'done';

    card.stage = nextStage;
    card.status = nextStatus;
    saveCardData(card);
  }

  async function saveCardData(card) {
    try {
      await fetch(SHEETS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'saveTrackingCard', payload: card })
      });
      loadData();
    } catch(e) { alert('Ошибка обновления'); }
  }

  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  }
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
</script>

</body>
</html>
